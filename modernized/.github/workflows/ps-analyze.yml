name: PowerShell Analysis

on:
  push:
    paths:
      - '**.ps1'
      - '**.psm1'
  pull_request:
    paths:
      - '**.ps1'
      - '**.psm1'

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object Severity -eq 'Error'
            if ($errors) { exit 1 }
          } else {
            Write-Host "No issues found."
          }

      - name: Basic secret pattern scan
        shell: pwsh
        run: |
          $patterns = @(
            'SharePointOnlineCredentials',
            'Read-Host\s+-Prompt\s+.*[Pp]assword',
            '@[a-z0-9-]+\.onmicrosoft\.com',
            'password\s*=\s*["\'][^"\']+["\']',
            'Web Server Extensions\\1[56]'
          )
          $found = $false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            foreach ($p in $patterns) {
              if ($content -match $p) {
                Write-Warning "Possible legacy/insecure pattern in $($_.FullName): $p"
                $found = $true
              }
            }
          }
          if ($found) {
            Write-Error "Legacy or insecure patterns detected. See warnings above."
            exit 1
          }
          Write-Host "No forbidden patterns found."
